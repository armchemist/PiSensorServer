# 모든 상대 경로는 이 YAML 파일 위치 기준입니다. policy_path만 robot.model_root 기준입니다.
# mode: live 전환 전 토픽/서버 주소/transfer_limits를 실장비에 맞게 보정하세요.
# 카메라·관절 토픽은 physical_ai_server config/omx_dual*_config.yaml 과 같은 값입니다. 모델의 cam_* 이름과 관절 순서는 학습 메타데이터 기준입니다.
# 체크포인트는 고정된 초기 후보이며 실장비 성공률로 선정한 최적 모델이 아닙니다.
schema_version: 1
mode: mock
data_dir: ../data
server:
  host: 127.0.0.1
  port: 8000
openai:
  api_key_env: OPENAI_API_KEY
  planner_model: gpt-6-luna
  decision_model: gpt-6-luna
  timeout_s: 30
  # 완료/미완료 이진 판정. complete 라도 confidence 가 min_confidence 미만이면 미완료로 본다
  # (실측: 정책이 움직이지 않았는데 0.54 로 complete).
  min_confidence: 0.7
  # 실행 중 판정 간격(초). 평균 시간의 절반 이후 이 간격으로 팔을 멈추지 않고 판정해 complete 면 정지한다.
  # 정책이 성공 후에도 동작을 반복해 멈추지 않는 경우가 있다(실측 45초 내내 반복). 0 이면 끈다.
  live_judge_interval_s: 3
  decision_prompts: decision_prompts.json
  # 사용자 승인 완료/미완료 예시. manifest와 JPEG는 저장소에 함께 포함합니다.
  decision_examples: decision_examples/manifest.json
rail:
  central_url: http://127.0.0.1:8100
  api_key_env: PISENSOR_API_KEY
  device_id: pi2
  timeout_s: 120
  # 레일 이동 속도(mm/s). 중앙 서버 상한 30.
  speed_mm_s: 30
  # 에이전트 스테이션 -> Pi 레일 스테이션 이름 (Pi 의 stations 목록과 같아야 한다)
  station_names: {시약존: 시약통, 실린더존: 시험관_실린더, 실험존: 비커_센서}
  # 레일 없이 팔만 시험할 때 스테이션 이름(시약존/실린더존/실험존). 그 스테이션 ACT만 실행하고
  # 레일 서버는 부르지 않는다. 비우면 위 central_url 레일을 쓴다.
  fixed_station: ''
graph:
  uri: ''
  user: neo4j
  password_env: NEO4J_PASSWORD
  database: neo4j
robot:
  rosbridge_url: ws://127.0.0.1:9090
  model_root: ../models
  initial_profile: omx_dual
  hold_profile: omx_dual
  # 정지 확인 허용 오차(rad). 실측: 정지 명령 직후 l_joint3 이 엔코더 2칸(0.0031) 처져 0.003 으로는 확인되지 않았다.
  hold_tolerance_rad: 0.01
  # 정지 확인 후 허용하는 관절 처짐(rad, 그리퍼 제외). 실측: 확인 직후 l_joint4 가 0.0107 더 움직여 0.01 로는 오류.
  hold_drift_rad: 0.05
  # ACT 실행 중 카메라 영상의 최대 나이(초). 실측: 손목 usb_cam(/camera2, /camera3) 헤더 시각이 약 1.1초 늦다.
  # 손목 카메라 USB 가 끊기면 재연결(~1초) + usb_cam 재시작(2초+) + warmup 동안 직전 영상으로 계속 실행한다.
  # 그 시간 동안 정책은 멈춘 손목 영상을 본다. 이보다 오래 끊기면 ACT 를 멈춘다.
  camera_max_age_s: 10.0
  # 카메라가 1초 넘게 끊겼다 돌아오면 이 시간 동안 새 프레임을 버린다(재연결 직후 공장 기본 노출의 하얀 화면).
  # dual_cameras.sh 가 노드 시작 4초 뒤 노출을 다시 넣는다. 0 이면 끈다.
  camera_warmup_s: 5.0
  # ACT 종료: 정책 출력(관절 목표)이 idle_s 동안 action_tolerance_rad 안에 머물면 정지 후 판정한다.
  # 평균 시간 × min_fraction 이전의 정지는 무시하고, 평균 × max_factor 에 도달하면 무조건 정지한다.
  # 데모 실측(setup_sensors): 약 11.3초에 동작이 끝나고 1.6~1.9초 정지 구간. 섹션을 지우면 평균 시간 고정 window.
  idle_stop:
    action_tolerance_rad: 0.02
    idle_s: 1.0
    min_fraction: 0.5
    max_factor: 3.5
  # 완료 후 actions.<ACT>.end_pose 로 옮기는 관절 속도 상한(rad/s). 최소 2초에 걸쳐 이동한다.
  end_pose_speed_rad_s: 0.5
  # 레일 이동 허용 관절 범위(rad): 모든 ACT end_pose 의 관절별 최소~최대 ±0.3. 그리퍼는 물건을 쥔 채 이동하므로 전체 범위.
  transfer_limits:
    l_joint1: [-0.371, 0.328]
    l_joint2: [-1.832, 0.167]
    l_joint3: [1.094, 1.894]
    l_joint4: [-2.001, 1.774]
    l_joint5: [-0.345, 0.359]
    l_gripper_joint_1: [-3.15, 3.15]
    r_joint1: [-0.319, 0.408]
    r_joint2: [-2.262, -1.252]
    r_joint3: [1.157, 2.012]
    r_joint4: [-0.514, 1.955]
    r_joint5: [-0.334, 0.389]
    r_gripper_joint_1: [-3.15, 3.15]
  profiles:
    omx_left:
      cameras:
        cam_head: /camera1/color/image_raw/compressed
        cam_head_depth: /camera4/image_raw/compressed
        cam_wrist: /camera3/image_raw/compressed
      joint_topics:
        follower_left: /follower_left/joint_states
        leader_left: /leader_left/joint_trajectory
      joint_order:
        leader_left:
        - l_joint1
        - l_joint2
        - l_joint3
        - l_joint4
        - l_joint5
        - l_gripper_joint_1
    omx_right:
      cameras:
        cam_head: /camera1/color/image_raw/compressed
        cam_head_depth: /camera4/image_raw/compressed
        cam_wrist: /camera2/image_raw/compressed
      joint_topics:
        follower_right: /follower_right/joint_states
        leader_right: /leader_right/joint_trajectory
      joint_order:
        leader_right:
        - r_joint1
        - r_joint2
        - r_joint3
        - r_joint4
        - r_joint5
        - r_gripper_joint_1
    omx_dual:
      cameras:
        cam_head: /camera1/color/image_raw/compressed
        cam_head_depth: /camera4/image_raw/compressed
        cam_wrist_left: /camera2/image_raw/compressed
        cam_wrist_right: /camera3/image_raw/compressed
      joint_topics:
        follower_left: /follower_left/joint_states
        leader_left: /leader_left/joint_trajectory
        follower_right: /follower_right/joint_states
        leader_right: /leader_right/joint_trajectory
      joint_order:
        leader_left:
        - l_joint1
        - l_joint2
        - l_joint3
        - l_joint4
        - l_joint5
        - l_gripper_joint_1
        leader_right:
        - r_joint1
        - r_joint2
        - r_joint3
        - r_joint4
        - r_joint5
        - r_gripper_joint_1
