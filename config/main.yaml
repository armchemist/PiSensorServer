# 모든 상대 경로는 이 YAML 파일 위치 기준입니다. policy_path만 robot.model_root 기준입니다.
# mode: live 전환 전 토픽/서버 주소/transfer_limits를 실장비에 맞게 보정하세요.
# 카메라·명령 토픽은 배치 예시입니다. 모델의 cam_* 이름과 관절 순서는 학습 메타데이터 기준입니다.
# 체크포인트는 고정된 초기 후보이며 실장비 성공률로 선정한 최적 모델이 아닙니다.
schema_version: 1
mode: mock
data_dir: ../data
server:
  host: 127.0.0.1
  port: 8000
openai:
  api_key_env: OPENAI_API_KEY
  planner_model: gpt-6-luna
  decision_model: gpt-6-luna
  timeout_s: 30
  # 완료/미완료 이진 판정. confidence는 기록만 하고 임계값을 적용하지 않는다.
  decision_prompts: decision_prompts.json
  # 사용자 승인 완료/미완료 예시. manifest와 JPEG는 저장소에 함께 포함합니다.
  decision_examples: decision_examples/manifest.json
rail:
  central_url: http://127.0.0.1:8100
  api_key_env: PISENSOR_API_KEY
  device_id: pi2
  timeout_s: 120
graph:
  uri: ''
  user: neo4j
  password_env: NEO4J_PASSWORD
  database: neo4j
robot:
  rosbridge_url: ws://127.0.0.1:9090
  model_root: ../models
  initial_profile: omx_dual
  hold_profile: omx_dual
  transfer_limits: {}
  profiles:
    omx_left:
      cameras:
        cam_head: /camera/head/image_raw/compressed
        cam_head_depth: /camera/head_depth/image_raw/compressed
        cam_wrist: /camera/wrist_left/image_raw/compressed
      joint_topics:
        follower_left: /left/joint_states
        leader_left: /left/joint_trajectory
      joint_order:
        leader_left:
        - l_joint1
        - l_joint2
        - l_joint3
        - l_joint4
        - l_joint5
        - l_gripper_joint_1
    omx_right:
      cameras:
        cam_head: /camera/head/image_raw/compressed
        cam_head_depth: /camera/head_depth/image_raw/compressed
        cam_wrist: /camera/wrist_right/image_raw/compressed
      joint_topics:
        follower_right: /right/joint_states
        leader_right: /right/joint_trajectory
      joint_order:
        leader_right:
        - r_joint1
        - r_joint2
        - r_joint3
        - r_joint4
        - r_joint5
        - r_gripper_joint_1
    omx_dual:
      cameras:
        cam_head: /camera/head/image_raw/compressed
        cam_head_depth: /camera/head_depth/image_raw/compressed
        cam_wrist_left: /camera/wrist_left/image_raw/compressed
        cam_wrist_right: /camera/wrist_right/image_raw/compressed
      joint_topics:
        follower_left: /left/joint_states
        leader_left: /left/joint_trajectory
        follower_right: /right/joint_states
        leader_right: /right/joint_trajectory
      joint_order:
        leader_left:
        - l_joint1
        - l_joint2
        - l_joint3
        - l_joint4
        - l_joint5
        - l_gripper_joint_1
        leader_right:
        - r_joint1
        - r_joint2
        - r_joint3
        - r_joint4
        - r_joint5
        - r_gripper_joint_1
initial_facts:
  left: empty
  right: empty
  cap: closed
