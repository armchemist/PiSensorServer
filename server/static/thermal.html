<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>열화상 ROI 추적 — TMC160F</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2c313b;
    --fg: #e6e8ec; --dim: #8b93a1; --accent: #ff8c42;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Noto Sans KR", Segoe UI, sans-serif;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .status { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  header .status b { color: var(--fg); font-weight: 600; }
  .wrap { display: flex; gap: 18px; padding: 18px; align-items: flex-start; flex-wrap: wrap; }
  .col-left { flex: 0 0 auto; }
  .col-right { flex: 1 1 380px; min-width: 340px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--dim); margin: 0 0 10px; font-weight: 600;
  }
  #stage { position: relative; line-height: 0; cursor: crosshair; touch-action: none; }
  #feed { display: block; border-radius: 8px; width: 640px; max-width: 100%; background: #000; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  label { color: var(--dim); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
  select, input[type=number], input[type=text] {
    background: #12141a; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px;
  }
  input[type=number] { width: 74px; }
  button {
    background: #262b34; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #2f3540; }
  button.danger:hover { background: #4a2226; border-color: #703038; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  td.num { text-align: right; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: middle; }
  .roi-name { background: none; border: none; color: var(--fg); font: inherit; padding: 2px 4px; width: 100%; border-radius: 4px; }
  .roi-name:hover, .roi-name:focus { background: #12141a; outline: 1px solid var(--line); }
  .mean { font-weight: 600; color: var(--accent); }
  .empty { color: var(--dim); padding: 18px 4px; text-align: center; font-size: 13px; }
  #chart { width: 100%; height: 260px; display: block; }
  .row-actions { white-space: nowrap; }
  .row-actions button { padding: 3px 7px; font-size: 12px; margin-left: 4px; }
  a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>열화상 ROI 추적 <span style="color:var(--dim);font-weight:400">TMC160F · 160×120 · 9fps</span></h1>
  <div class="status" id="status">연결 중…</div>
</header>

<div class="wrap">
  <div class="col-left">
    <div class="panel">
      <h2>실시간 피드</h2>
      <div id="stage">
        <img id="feed" alt="열화상 피드">
        <canvas id="overlay"></canvas>
      </div>
      <div class="hint">영상 위에서 <b>드래그</b>하면 그 영역이 추적 대상으로 등록됩니다.</div>
      <div class="controls">
        <label>컬러맵
          <select id="cmap">
            <option value="inferno">inferno</option>
            <option value="magma">magma</option>
            <option value="turbo">turbo</option>
            <option value="jet">jet</option>
            <option value="hot">hot</option>
            <option value="gray">gray</option>
          </select>
        </label>
        <label><input type="checkbox" id="smooth"> 부드럽게</label>
        <label><input type="checkbox" id="manual"> 범위 고정</label>
        <label>최저 <input type="number" id="tmin" step="0.5" value="20" disabled> ℃</label>
        <label>최고 <input type="number" id="tmax" step="0.5" value="35" disabled> ℃</label>
      </div>
    </div>
  </div>

  <div class="col-right">
    <div class="panel">
      <h2>추적 중인 영역</h2>
      <table id="roi-table">
        <thead>
          <tr>
            <th style="width:38%">이름</th>
            <th class="num">평균 ℃</th>
            <th class="num">최저</th>
            <th class="num">최고</th>
            <th class="num">표본</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="roi-body"></tbody>
      </table>
      <div class="empty" id="roi-empty">아직 없습니다. 왼쪽 영상에서 드래그해 보세요.</div>
      <div class="controls">
        <button id="clear-all" class="danger">전체 삭제</button>
        <button id="reset-all">시계열만 초기화</button>
      </div>
    </div>

    <div class="panel">
      <h2>평균 온도 시계열</h2>
      <canvas id="chart"></canvas>
      <div class="controls">
        <label>구간
          <select id="span">
            <option value="300">최근 5분</option>
            <option value="900" selected>최근 15분</option>
            <option value="3600">최근 1시간</option>
            <option value="21600">최근 6시간</option>
            <option value="0">전체</option>
          </select>
        </label>
        <span class="hint" id="chart-note" style="margin:0"></span>
      </div>
    </div>
  </div>
</div>

<script>
// ROI 색: 서버가 영상에 그리는 순서(thermal_render.ROI_COLORS)와 맞춰 둔다.
const COLORS = ["#ffffff", "#ffff00", "#00ffff", "#00ff00", "#ff00ff"];
const SENSOR_W = 160, SENSOR_H = 120;

// API 키가 걸려 있으면 ?api_key=... 로 열거나 localStorage 에 넣어 둔다.
const params = new URLSearchParams(location.search);
const API_KEY = params.get("api_key") || localStorage.getItem("api_key") || "";
if (params.get("api_key")) localStorage.setItem("api_key", params.get("api_key"));

function url(path, extra = {}) {
  const u = new URL(path, location.origin);
  if (API_KEY) u.searchParams.set("api_key", API_KEY);
  for (const [k, v] of Object.entries(extra)) {
    if (v !== null && v !== undefined && v !== "") u.searchParams.set(k, v);
  }
  return u.toString();
}
async function api(path, opts = {}, extra = {}) {
  const res = await fetch(url(path, extra), {
    ...opts,
    headers: { "Content-Type": "application/json", ...(API_KEY ? { "X-API-Key": API_KEY } : {}) },
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.status === 204 ? null : res.json();
}

const $ = (id) => document.getElementById(id);
const feed = $("feed"), overlay = $("overlay"), stage = $("stage");

// --- 스트림 --------------------------------------------------------------
function streamOpts() {
  const manual = $("manual").checked;
  return {
    width: 640,
    colormap: $("cmap").value,
    smooth: $("smooth").checked ? "true" : "",
    tmin: manual ? $("tmin").value : "",
    tmax: manual ? $("tmax").value : "",
  };
}
function reloadStream() {
  // 캐시를 피하려고 매번 다른 쿼리를 붙인다.
  feed.src = url("/thermal/stream", { ...streamOpts(), _: Date.now() });
}
for (const id of ["cmap", "smooth", "manual", "tmin", "tmax"]) {
  $(id).addEventListener("change", () => {
    const manual = $("manual").checked;
    $("tmin").disabled = $("tmax").disabled = !manual;
    reloadStream();
  });
}

// --- 드래그로 bbox 그리기 -------------------------------------------------
let drag = null;

function toSensor(ev) {
  const r = feed.getBoundingClientRect();
  const x = ((ev.clientX - r.left) / r.width) * SENSOR_W;
  const y = ((ev.clientY - r.top) / r.height) * SENSOR_H;
  return {
    x: Math.max(0, Math.min(SENSOR_W - 1, x)),
    y: Math.max(0, Math.min(SENSOR_H - 1, y)),
  };
}
function drawOverlay() {
  const r = feed.getBoundingClientRect();
  overlay.width = r.width; overlay.height = r.height;
  const g = overlay.getContext("2d");
  g.clearRect(0, 0, overlay.width, overlay.height);
  if (!drag) return;
  const sx = overlay.width / SENSOR_W, sy = overlay.height / SENSOR_H;
  const x = Math.min(drag.a.x, drag.b.x) * sx, y = Math.min(drag.a.y, drag.b.y) * sy;
  const w = Math.abs(drag.b.x - drag.a.x) * sx, h = Math.abs(drag.b.y - drag.a.y) * sy;
  g.strokeStyle = "#ff8c42"; g.lineWidth = 2; g.setLineDash([5, 4]);
  g.strokeRect(x, y, w, h);
  g.setLineDash([]);
  g.fillStyle = "rgba(255,140,66,.15)";
  g.fillRect(x, y, w, h);
}

stage.addEventListener("pointerdown", (ev) => {
  ev.preventDefault();
  stage.setPointerCapture(ev.pointerId);
  const p = toSensor(ev);
  drag = { a: p, b: p };
  drawOverlay();
});
stage.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  drag.b = toSensor(ev);
  drawOverlay();
});
stage.addEventListener("pointerup", async (ev) => {
  if (!drag) return;
  const { a, b } = drag;
  drag = null;
  drawOverlay();
  const x = Math.round(Math.min(a.x, b.x)), y = Math.round(Math.min(a.y, b.y));
  const w = Math.round(Math.abs(b.x - a.x)), h = Math.round(Math.abs(b.y - a.y));
  if (w < 1 || h < 1) return;  // 그냥 클릭한 경우
  try {
    await api("/thermal/roi", { method: "POST", body: JSON.stringify({ x, y, w, h }) });
    await refreshRois();
  } catch (e) { alert("등록 실패: " + e.message); }
});
window.addEventListener("resize", drawOverlay);

// --- ROI 목록 ------------------------------------------------------------
let rois = [];

async function refreshRois() {
  try {
    rois = (await api("/thermal/rois")).rois;
  } catch { return; }
  const body = $("roi-body");
  // 이름을 고치고 있는 중이면 표를 새로 그리지 않는다 (포커스가 날아간다).
  if (body.contains(document.activeElement) && document.activeElement.matches(".roi-name")) {
    updateValuesOnly();
    return;
  }
  $("roi-empty").style.display = rois.length ? "none" : "block";
  body.innerHTML = "";
  rois.forEach((r, i) => {
    const tr = document.createElement("tr");
    const last = r.last || {};
    tr.innerHTML = `
      <td><span class="swatch" style="background:${COLORS[i % COLORS.length]}"></span>
          <input class="roi-name" value="${r.name.replace(/"/g, "&quot;")}" data-id="${r.id}"></td>
      <td class="num mean">${fmt(last.mean_c)}</td>
      <td class="num">${fmt(last.min_c)}</td>
      <td class="num">${fmt(last.max_c)}</td>
      <td class="num">${r.samples}</td>
      <td class="row-actions">
        <button data-csv="${r.id}" title="CSV 내려받기">CSV</button>
        <button data-del="${r.id}" class="danger" title="삭제">×</button>
      </td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll("[data-del]").forEach((b) =>
    b.onclick = async () => { await api("/thermal/roi/" + b.dataset.del, { method: "DELETE" }); refreshRois(); });
  body.querySelectorAll("[data-csv]").forEach((b) =>
    b.onclick = () => location.href = url(`/thermal/roi/${b.dataset.csv}/series.csv`));
  body.querySelectorAll(".roi-name").forEach((inp) =>
    inp.onchange = async () => {
      try {
        await api("/thermal/roi/" + inp.dataset.id, {
          method: "PATCH", body: JSON.stringify({ name: inp.value }),
        });
      } catch (e) { alert("이름 변경 실패: " + e.message); }
    });
}

/** 표를 다시 만들지 않고 숫자 칸만 갈아끼운다. */
function updateValuesOnly() {
  $("roi-body").querySelectorAll("tr").forEach((tr, i) => {
    const r = rois[i];
    if (!r) return;
    const last = r.last || {};
    const cells = tr.querySelectorAll("td.num");
    [last.mean_c, last.min_c, last.max_c].forEach((v, k) => (cells[k].textContent = fmt(v)));
    cells[3].textContent = r.samples;
  });
}
const fmt = (v) => (v === undefined || v === null ? "—" : v.toFixed(2));

$("clear-all").onclick = async () => {
  if (!rois.length || !confirm("등록된 영역을 모두 지웁니다.")) return;
  await api("/thermal/rois", { method: "DELETE" });
  refreshRois();
};
$("reset-all").onclick = async () => {
  for (const r of rois) await api(`/thermal/roi/${r.id}/reset`, { method: "POST" });
  refreshRois();
};

// --- 차트 ----------------------------------------------------------------
const chart = $("chart");
let sampleInterval = 1.0;  // /health 로 실제 값을 받아 덮어쓴다

async function drawChart() {
  const span = Number($("span").value);
  // 몇 개를 받아야 그 시간만큼인지는 샘플 간격에 달렸다. 서버가 알려준 값을 쓴다.
  const limit = span ? Math.ceil(span / sampleInterval) : undefined;
  const series = [];
  for (const r of rois) {
    try {
      const d = await api("/thermal/roi/" + r.id, {}, limit ? { limit } : {});
      series.push({ name: r.name, points: d.series });
    } catch { /* 그 사이 지워졌을 수 있다 */ }
  }
  const g = chart.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const W = chart.clientWidth, H = chart.clientHeight;
  chart.width = W * dpr; chart.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const all = series.flatMap((s) => s.points);
  $("chart-note").textContent = all.length
    ? `${all.length}개 표본 · 샘플 간격 ${sampleInterval}초` : "";
  if (!all.length) {
    g.fillStyle = "#8b93a1"; g.font = "13px sans-serif"; g.textAlign = "center";
    g.fillText("영역을 등록하면 여기에 그려집니다.", W / 2, H / 2);
    return;
  }

  const pad = { l: 52, r: 12, t: 12, b: 26 };
  let t0 = Math.min(...all.map((p) => p.t)), t1 = Math.max(...all.map((p) => p.t));
  let y0 = Math.min(...all.map((p) => p.mean_c)), y1 = Math.max(...all.map((p) => p.mean_c));
  if (t1 - t0 < 1) t1 = t0 + 1;
  const yPad = Math.max(0.05, (y1 - y0) * 0.15);
  y0 -= yPad; y1 += yPad;
  const X = (t) => pad.l + ((t - t0) / (t1 - t0)) * (W - pad.l - pad.r);
  const Y = (v) => H - pad.b - ((v - y0) / (y1 - y0)) * (H - pad.t - pad.b);

  // 눈금
  g.strokeStyle = "#2c313b"; g.fillStyle = "#8b93a1";
  g.font = "11px sans-serif"; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = y0 + ((y1 - y0) * i) / 4, y = Y(v);
    g.beginPath(); g.moveTo(pad.l, y); g.lineTo(W - pad.r, y); g.stroke();
    g.textAlign = "right"; g.fillText(v.toFixed(2) + "℃", pad.l - 7, y + 3.5);
  }
  g.textAlign = "center";
  for (let i = 0; i <= 3; i++) {
    const t = t0 + ((t1 - t0) * i) / 3;
    g.fillText(new Date(t * 1000).toLocaleTimeString("ko-KR", { hour12: false }), X(t), H - 8);
  }

  series.forEach((s, i) => {
    if (!s.points.length) return;
    g.strokeStyle = COLORS[i % COLORS.length];
    g.lineWidth = 1.6; g.beginPath();
    s.points.forEach((p, k) => (k ? g.lineTo(X(p.t), Y(p.mean_c)) : g.moveTo(X(p.t), Y(p.mean_c))));
    g.stroke();
  });
}
$("span").onchange = drawChart;

// --- 상태 표시 -----------------------------------------------------------
async function refreshStatus() {
  try {
    const h = await api("/health");
    const t = h.thermal;
    if (t.sample_interval_s) sampleInterval = t.sample_interval_s;
    if (!t.opened) {
      $("status").innerHTML = `<b style="color:#ff6b6b">연결 안 됨</b> — ${t.error || t.device}`;
      return;
    }
    let extra = "";
    try {
      const s = await api("/thermal/stats");
      extra = ` · 화면 ${s.min_c.toFixed(1)}–${s.max_c.toFixed(1)}℃`;
    } catch {}
    $("status").innerHTML =
      `<b>연결됨</b> ${t.device} · 프레임 ${t.frames}${extra}`;
  } catch (e) {
    $("status").innerHTML = `<b style="color:#ff6b6b">서버 응답 없음</b>`;
  }
}

feed.addEventListener("load", drawOverlay);
reloadStream();
refreshRois();
refreshStatus();
setInterval(refreshRois, 1000);
setInterval(drawChart, 2000);
setInterval(refreshStatus, 5000);
drawChart();
</script>
</body>
</html>
